spring.application.name=dssd
spring.datasource.url=jdbc:postgresql://localhost:5432/dssd_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=update

# Puerto del backend. Bonita Studio usa el 8080, por eso usamos el 8082 por defecto.
# Todas estas propiedades se pueden pisar con variables de entorno (SERVER_PORT, BONITA_URL, etc.).
server.port=${SERVER_PORT:8082}

# Configuracion de Bonita
bonita.api.url=${BONITA_URL:http://localhost:8080/bonita}
bonita.process.name=GestionEmergencias

# Un usuario de Bonita por rol (actor). Default: los usuarios de desarrollo de OrganizacionGestora (password "bpm").
# Se pueden pisar con variables de entorno (BONITA_MUNICIPIO_PASSWORD, BONITA_COORDINADOR_PASSWORD)
# o como Program arguments de Eclipse (--bonita.usuarios.municipio.password=...).
# En un ambiente real las contraseñas no deberian quedar en el repo.
bonita.usuarios.municipio.username=${BONITA_MUNICIPIO_USER:olmos}
bonita.usuarios.municipio.password=${BONITA_MUNICIPIO_PASSWORD:bpm}
bonita.usuarios.coordinador.username=${BONITA_COORDINADOR_USER:agente_coordinador_1}
bonita.usuarios.coordinador.password=${BONITA_COORDINADOR_PASSWORD:bpm}
