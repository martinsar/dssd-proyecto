spring.application.name=dssd
spring.datasource.url=jdbc:postgresql://localhost:5432/dssd_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=update

# Puerto del backend. Bonita Studio usa el 8080, por eso usamos el 8082 por defecto.
# Todas estas propiedades se pueden pisar con variables de entorno (SERVER_PORT, BONITA_URL, etc.).
server.port=${SERVER_PORT:8082}

# Configuracion de Bonita
bonita.api.url=${BONITA_URL:http://localhost:8081/bonita}
bonita.process.name=GestionEmergencias

# Un usuario de Bonita por rol (actor). Default: los usuarios de desarrollo de OrganizacionGestora (password "bpm").
# Se pueden pisar con variables de entorno (BONITA_MUNICIPIO_PASSWORD, BONITA_COORDINADOR_PASSWORD)
# o como Program arguments de Eclipse (--bonita.usuarios.municipio.password=...).
# En un ambiente real las contraseñas no deberian quedar en el repo.
bonita.usuarios.municipio.username=${BONITA_MUNICIPIO_USER:olmos_municipio}
bonita.usuarios.municipio.password=${BONITA_MUNICIPIO_PASSWORD:bpm}
bonita.usuarios.coordinador.username=${BONITA_COORDINADOR_USER:agente_coordinador_1}
bonita.usuarios.coordinador.password=${BONITA_COORDINADOR_PASSWORD:bpm}
# [Entrega final] Usuario del rol Organizaciones que ejecuta "Finalizar actividades"
bonita.usuarios.ong.username=${BONITA_ONG_USER:caritas_ong}
bonita.usuarios.ong.password=${BONITA_ONG_PASSWORD:bpm}
# [Entrega final] En la entrega va true: la adjudicación espera la notificación formal de Bonita
# y las tareas "Seleccionar ofertas" y "Finalizar actividades" son obligatorias. Con false se adjudica
# en el momento y si esas tareas faltan o fallan solo se registra en el log.
rescuesync.bonita.integracion-completa=${RESCUESYNC_INTEGRACION_COMPLETA:false}

# [Entrega final] Sesiones de la app (minutos de inactividad y duracion maxima en horas)
rescuesync.sesion.minutos-inactividad=${SESION_MINUTOS:30}
rescuesync.sesion.horas-maximas=${SESION_HORAS:8}
# [Entrega final] Clave que manda Bonita en el header X-Api-Key
rescuesync.integracion.api-key=${RESCUESYNC_API_KEY:rescuesync-bonita-2026}
# [Entrega final] Origenes permitidos por CORS (separados por comas)
rescuesync.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://127.0.0.1:4200}

# [Entrega final] Se carga data.sql en cada arranque, despues de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
